services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shortlist
      POSTGRES_PASSWORD: shortlist
      POSTGRES_DB: shortlist
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/src/db/test-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortlist -d shortlist"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
